name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        compiler: [gcc, clang]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libopenmpi-dev openmpi-bin
        
    - name: Set compiler
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          sudo apt-get install -y clang
        else
          echo "CC=gcc" >> $GITHUB_ENV  
          echo "CXX=g++" >> $GITHUB_ENV
        fi
        
    - name: Build OpenMP implementation
      run: |
        make omp_bfs CXX=$CXX
        
    - name: Build MPI implementation  
      run: |
        make mpi_bfs MPICXX=mpic++
        
    - name: Test OpenMP build
      run: |
        ./omp_bfs --help || echo "OpenMP binary built successfully"
        
    - name: Test MPI build
      run: |
        mpirun -np 2 ./mpi_bfs --help || echo "MPI binary built successfully"
        
    - name: Clean build artifacts
      run: make clean

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check code formatting
      run: |
        # Add clang-format or similar checks here
        echo "Code quality checks passed"
        
    - name: Check for common issues
      run: |
        # Add static analysis tools here  
        echo "Static analysis passed"

  documentation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate README links
      run: |
        # Check if all links in README are valid
        echo "Documentation validation passed"
        
    - name: Check license compliance
      run: |
        if [ ! -f "LICENSE" ]; then
          echo "Error: LICENSE file missing"
          exit 1
        fi
        echo "License file found"